# ──────────────────────────────────────────────────────────────
#  NIGHTWIRE — kitty (lush)
#  Phosphor-void palette, generous padding, 82% opacity so the
#  hyprland blur reads behind. JetBrains Mono, matching tabs.
# ──────────────────────────────────────────────────────────────

# WINDOW
remember_window_size    no
initial_window_width    120c
initial_window_height   35c
window_padding_width    18
window_margin_width     0
hide_window_decorations yes
confirm_os_window_close 0
window_border_width     0

# OPACITY — lower, more blur reads through
background_opacity         0.82
dynamic_background_opacity yes
background_tint            0.0

# FONT
font_family       JetBrainsMono Nerd Font
bold_font         JetBrainsMono Nerd Font Bold
italic_font       JetBrainsMono Nerd Font Italic
bold_italic_font  auto
font_size         12.0
disable_ligatures never
modify_font cell_height 115%

# CURSOR
cursor                #00ff9c
cursor_text_color     #02130c
cursor_shape          beam
cursor_beam_thickness 1.8
cursor_blink_interval 0.6
cursor_trail          3
cursor_trail_decay    0.08 0.22

# SCROLLBACK
scrollback_lines              20000
scrollback_pager_history_size 10

# MISC
enable_audio_bell    no
visual_bell_duration 0.0
window_alert_on_bell no
mouse_hide_wait      2
url_color            #00e5ff
url_style            curly
copy_on_select       yes

# NIGHTWIRE PALETTE
foreground            #d8e3d4
background            #05070a
selection_foreground  #02130c
selection_background  #00ff9c

# blacks
color0  #0a0e14
color8  #1b2330

# reds — blood critical
color1  #ff003c
color9  #ff6a8a

# greens — phosphor primary
color2  #00ff9c
color10 #4dffb8

# yellows — amber warning
color3  #ffb000
color11 #ffd060

# blues — cyan tertiary
color4  #00e5ff
color12 #66eeff

# magentas — hot secondary
color5  #ff2975
color13 #ff6ca3

# cyans
color6  #00e5ff
color14 #80f0ff

# whites
color7  #d8e3d4
color15 #ffffff

# tab bar — rounded, phosphor active
tab_bar_style           slant
tab_bar_min_tabs        2
tab_separator           ""
tab_title_template      "{index}  {title}"
active_tab_foreground   #02130c
active_tab_background   #00ff9c
active_tab_font_style   bold
inactive_tab_foreground #7b8a84
inactive_tab_background #0a0e14
