# -------------------------
# WINDOW
# -------------------------
remember_window_size  no
initial_window_width  120c
initial_window_height 35c
window_padding_width  12

# -------------------------
# OPACITY
# -------------------------
background_opacity        0.85
dynamic_background_opacity yes

# -------------------------
# FONT
# -------------------------
font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
font_size        11.0

# -------------------------
# CURSOR
# -------------------------
cursor                #a7c080
cursor_text_color     #272e33
cursor_shape          block
cursor_blink_interval 0

# -------------------------
# SCROLLBACK
# -------------------------
scrollback_lines 10000

# -------------------------
# MISC
# -------------------------
enable_audio_bell     no
confirm_os_window_close 0

# -------------------------
# EVERFOREST DARK COLORS
# -------------------------
background            #272e33
foreground            #d3c6aa
selection_background  #374145
selection_foreground  #d3c6aa

# blacks
color0  #374145
color8  #414b50

# reds
color1  #e67e80
color9  #e67e80

# greens
color2  #a7c080
color10 #a7c080

# yellows
color3  #dbbc7f
color11 #dbbc7f

# blues
color4  #7fbbb3
color12 #7fbbb3

# magentas
color5  #d699b6
color13 #d699b6

# cyans
color6  #83c092
color14 #83c092

# whites
color7  #d3c6aa
color15 #d3c6aa
