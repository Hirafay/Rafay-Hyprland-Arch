"$schema" = 'https://starship.rs/config-schema.json'

# ─────────────────────────────────────────────────────────────
#  Starship — AMBERPHOSPHOR
#  Minimal two-line prompt: segment bar / shell prompt
# ─────────────────────────────────────────────────────────────

format = """
[╭─](amber)\
$os\
$username\
$hostname\
[](bg:dim fg:amber)\
$directory\
[](bg:deep fg:dim)\
$git_branch\
$git_status\
[](bg:none fg:deep)\
$c$cpp$rust$golang$nodejs$bun$python$kotlin$java$php$haskell\
$docker_context\
$conda\
$time\
$line_break\
[╰─](amber)$character"""

add_newline = true
palette = "amber"

[palettes.amber]
amber  = "#ffb000"
sun    = "#ff8800"
flare  = "#ff4b00"
dim    = "#1a1a1a"
deep   = "#141414"
bg     = "#0a0a0a"
fg     = "#ffe0a0"

[os]
disabled = false
style = "bg:amber fg:bg"
format = "[ $symbol ]($style)"

[os.symbols]
Arch         = "󰣇"
CachyOS      = "󰣇"
EndeavourOS  = "󰣇"
Manjaro      = "󰣇"
Garuda       = "󰛓"
Ubuntu       = ""
Debian       = ""
Fedora       = ""

[username]
show_always = true
style_user = "bg:amber fg:bg bold"
style_root = "bg:flare fg:bg bold"
format = "[ $user ]($style)"

[hostname]
ssh_only = false
style = "bg:amber fg:bg"
format = "[@$hostname ]($style)"
disabled = false

[directory]
style = "bg:dim fg:amber bold"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"
read_only = " "
read_only_style = "bg:dim fg:flare"

[directory.substitutions]
"Documents"  = "󰈙 "
"Downloads"  = " "
"Music"      = "󰝚 "
"Pictures"   = " "
"Developer"  = "󰲋 "
"Projects"   = " "
"Desktop"    = " "

[git_branch]
symbol = ""
style = "bg:deep"
format = '[[ $symbol $branch ](fg:amber bg:deep)]($style)'

[git_status]
style = "bg:deep"
format = '[[($all_status$ahead_behind )](fg:sun bg:deep)]($style)'
ahead = "⇡${count}"
diverged = "⇕⇡${ahead_count}⇣${behind_count}"
behind = "⇣${count}"
conflicted = "="
modified = "!${count}"
staged = "+${count}"
untracked = "?${count}"
deleted = "✘${count}"
renamed = "»${count}"
stashed = "\\$${count}"

[nodejs]      ; symbol = " ";   style = "fg:fg bg:bg"; format = '[[ $symbol($version) ](fg:amber)]($style)'
[bun]         ; symbol = " ";   style = "fg:fg bg:bg"; format = '[[ $symbol($version) ](fg:amber)]($style)'
[c]           ; symbol = " ";  style = "fg:fg bg:bg"; format = '[[ $symbol($version) ](fg:amber)]($style)'
[cpp]         ; symbol = " ";  style = "fg:fg bg:bg"; format = '[[ $symbol($version) ](fg:amber)]($style)'
[rust]        ; symbol = " ";   style = "fg:fg bg:bg"; format = '[[ $symbol($version) ](fg:amber)]($style)'
[golang]      ; symbol = " ";   style = "fg:fg bg:bg"; format = '[[ $symbol($version) ](fg:amber)]($style)'
[python]      ; symbol = " ";   style = "fg:fg bg:bg"; format = '[[ $symbol($version) ](fg:amber)]($style)'
[kotlin]      ; symbol = " ";   style = "fg:fg bg:bg"; format = '[[ $symbol($version) ](fg:amber)]($style)'
[java]        ; symbol = " ";   style = "fg:fg bg:bg"; format = '[[ $symbol($version) ](fg:amber)]($style)'
[php]         ; symbol = " ";   style = "fg:fg bg:bg"; format = '[[ $symbol($version) ](fg:amber)]($style)'
[haskell]     ; symbol = " ";   style = "fg:fg bg:bg"; format = '[[ $symbol($version) ](fg:amber)]($style)'

[docker_context]
symbol = " "
style = "fg:sun"
format = '[ $symbol$context ]($style)'

[conda]
symbol = " "
style = "fg:sun"
format = '[ $symbol$environment ]($style)'

[time]
disabled = false
time_format = "%H:%M"
style = "fg:amber"
format = '[  $time ]($style)'

[line_break]
disabled = false

[character]
disabled = false
success_symbol = "[](bold fg:amber)"
error_symbol   = "[](bold fg:flare)"
vimcmd_symbol  = "[](bold fg:sun)"
