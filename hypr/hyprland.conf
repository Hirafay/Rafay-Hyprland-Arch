




# -------------------------
# MONITOR
# -------------------------
monitor = eDP-1, 1920x1080@60, 0x0, 1.25

# -------------------------
# AUTOSTART
# -------------------------
exec-once = hypridle
exec-once = hyprctl setcursor Bibata-Modern-Classic 24
exec-once = waybar
exec-once = /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1 &
exec-once = swww-daemon
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store
# -------------------------
# VARIABLES
# -------------------------
$mainMod = SUPER
$terminal = kitty
$launcher = wofi --show drun
$filemanager = thunar

# -------------------------
# GENERAL
# -------------------------
general {
    gaps_in = 3
    gaps_out = 8
    border_size = 2
    col.active_border = rgba(a7c080ff) rgba(83c092ff) 45deg
    col.inactive_border = rgba(414b50aa)
    layout = dwindle
    resize_on_border = true
}

# -------------------------
# DECORATION
# -------------------------
decoration {
    rounding = 8

    blur {
        enabled = true
        size = 6
        passes = 3
        new_optimizations = true
        xray = false
        noise = 0.02
        contrast = 0.9
        brightness = 0.8
    }

    shadow {
        enabled = true
        range = 20
        render_power = 3
        color = rgba(0d1117cc)
        color_inactive = rgba(0d111788)
    }

    inactive_opacity = 0.92
    active_opacity = 1.0
    fullscreen_opacity = 1.0
}

# -------------------------
# ANIMATIONS
# -------------------------
animations {
    enabled = true

    bezier = overshot,  0.05, 0.9, 0.1, 1.05
    bezier = smoothOut, 0.36, 0, 0.66, -0.56
    bezier = smoothIn,  0.25, 1, 0.5, 1
    bezier = snappy,    0.68, -0.55, 0.27, 1.55

    animation = windows,     1, 5,  overshot,  slide
    animation = windowsOut,  1, 4,  smoothOut, slide
    animation = windowsMove, 1, 4,  smoothIn,  slide
    animation = border,      1, 10, default
    animation = borderangle, 1, 8,  linear,    loop
    animation = fade,        1, 10, smoothIn
    animation = fadeDim,     1, 10, smoothIn
    animation = workspaces,  1, 6,  snappy,    slidevert
}

# -------------------------
# DWINDLE LAYOUT
# -------------------------
dwindle {
    preserve_split = true
}

# -------------------------
# INPUT
# -------------------------
input {
    kb_layout = us
    follow_mouse = 1
    sensitivity = 0
    touchpad {
        natural_scroll = true
    }
}

# -------------------------
# MISC
# -------------------------
misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    animate_manual_resizes = true
    mouse_move_enables_dpms = true
    enable_swallow = true
    swallow_regex = ^(kitty)$
}

# -------------------------
# KEYBINDS
# -------------------------

# core
bind = $mainMod, RETURN, exec, $terminal
bind = $mainMod, SPACE, exec, $launcher
bind = $mainMod, E, exec, $filemanager
bind = $mainMod, Q, killactive
bind = $mainMod, M, exit
bind = $mainMod, V, exec, cliphist list | wofi --dmenu | cliphist decode | wl-copy
# window
bind = $mainMod, F, togglefloating
bind = $mainMod, G, fullscreen, 0
bind = $mainMod, S, swapnext

# waypaper
bind = $mainMod, W, exec, waypaper

# hyprlock
bind = $mainMod, L, exec, hyprlock

# screenshot
bind = , Print, exec, grimblast copysave area ~/Pictures/$(date +%Y-%m-%d_%H-%M-%S).png
bind = SHIFT, Print, exec, grimblast copysave screen ~/Pictures/$(date +%Y-%m-%d_%H-%M-%S).png

# focus move
bind = $mainMod, left,  movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up,    movefocus, u
bind = $mainMod, down,  movefocus, d

# vim-style focus
bind = $mainMod, H, movefocus, l
bind = $mainMod, L, movefocus, r
bind = $mainMod, K, movefocus, u
bind = $mainMod, J, movefocus, d

# workspace switch
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9

# move window to workspace
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9

# scroll through workspaces
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up,   workspace, e-1

# move floating windows
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# volume keys
bindel = , XF86AudioRaiseVolume,  exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
bindel = , XF86AudioLowerVolume,  exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindl  = , XF86AudioMute,         exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle

# brightness keys
bindel = , XF86MonBrightnessUp,   exec, brightnessctl set 5%+
bindel = , XF86MonBrightnessDown, exec, brightnessctl set 5%-
