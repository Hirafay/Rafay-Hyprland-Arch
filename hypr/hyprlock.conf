# ──────────────────────────────────────────────────────────────
#  NIGHTWIRE — hyprlock (lush)
#  Blurred wallpaper, giant glowing clock, rounded phosphor
#  input, now-playing strip, time-of-day greeting.
# ──────────────────────────────────────────────────────────────

# BACKGROUND
background {
    monitor =
    path = $HOME/.config/hypr/hyprlock.png
    color = rgba(5, 7, 10, 1.0)
    blur_passes = 4
    blur_size = 8
    noise = 0.012
    contrast = 1.0
    brightness = 0.55
    vibrancy = 0.22
    vibrancy_darkness = 0.1
}

general {
    no_fade_in = false
    no_fade_out = false
    grace = 0
    disable_loading_bar = false
    hide_cursor = true
}

# ── GIANT CLOCK with phosphor glow ────────────────────────────
label {
    monitor =
    text = cmd[update:1000] echo "<span>$(date +'%H:%M')</span>"
    color = rgba(0, 255, 156, 1.0)
    font_size = 220
    font_family = JetBrainsMono Nerd Font Bold
    position = 0, 180
    halign = center
    valign = center
    shadow_passes = 5
    shadow_size = 10
    shadow_color = rgba(0, 255, 156, 0.4)
    shadow_boost = 1.2
}

# seconds — small, subtle, directly under
label {
    monitor =
    text = cmd[update:1000] echo "<span>:$(date +'%S')</span>"
    color = rgba(0, 229, 255, 0.85)
    font_size = 32
    font_family = JetBrainsMono Nerd Font Bold
    position = 0, 40
    halign = center
    valign = center
}

# ── DATE + GREETING ───────────────────────────────────────────
label {
    monitor =
    text = cmd[update:60000] echo "$(date +'%A, %d %B %Y')"
    color = rgba(216, 227, 212, 0.95)
    font_size = 20
    font_family = JetBrainsMono Nerd Font
    position = 0, -20
    halign = center
    valign = center
}

# time-of-day greeting (morning/afternoon/evening/night)
label {
    monitor =
    text = cmd[update:60000] bash -c 'h=$(date +%H); if [ $h -lt 5 ]; then echo "// still up, $(whoami)"; elif [ $h -lt 12 ]; then echo "// good morning, $(whoami)"; elif [ $h -lt 17 ]; then echo "// good afternoon, $(whoami)"; elif [ $h -lt 21 ]; then echo "// good evening, $(whoami)"; else echo "// goodnight, $(whoami)"; fi'
    color = rgba(255, 41, 117, 0.9)
    font_size = 13
    font_family = JetBrainsMono Nerd Font
    position = 0, -54
    halign = center
    valign = center
}

# ── INPUT FIELD (rounded, phosphor glow) ──────────────────────
input-field {
    monitor =
    size = 420, 60
    outline_thickness = 2
    dots_size = 0.28
    dots_spacing = 0.35
    dots_center = true
    outer_color = rgba(0, 255, 156, 1.0)
    inner_color = rgba(10, 14, 20, 0.6)
    font_color = rgba(216, 227, 212, 1.0)
    fade_on_empty = false
    font_family = JetBrainsMono Nerd Font
    placeholder_text = <i><span foreground="##7b8a84">󰌾   Password</span></i>
    fail_text = <i>$FAIL <b>·  ($ATTEMPTS)</b></i>
    hide_input = false
    rounding = 28
    capslock_color = rgba(255, 176, 0, 1.0)
    check_color = rgba(0, 229, 255, 1.0)
    fail_color = rgba(255, 0, 60, 1.0)
    position = 0, -150
    halign = center
    valign = center
    shadow_passes = 3
    shadow_size = 8
    shadow_color = rgba(0, 255, 156, 0.25)
}

# ── NOW PLAYING strip (bottom-center) ─────────────────────────
label {
    monitor =
    text = cmd[update:2000] bash -c 'p=$(playerctl status 2>/dev/null); if [ "$p" = "Playing" ] || [ "$p" = "Paused" ]; then i=$([ "$p" = "Playing" ] && echo "󰎈" || echo "󰏤"); echo "$i  $(playerctl metadata --format "{{artist}} — {{title}}" 2>/dev/null | head -c 60)"; fi'
    color = rgba(255, 41, 117, 0.95)
    font_size = 14
    font_family = JetBrainsMono Nerd Font
    position = 0, 160
    halign = center
    valign = bottom
}

# ── POWER HINT STRIP ──────────────────────────────────────────
label {
    monitor =
    text = 󰐥   󰜉   󰤄
    color = rgba(123, 138, 132, 0.6)
    font_size = 24
    font_family = JetBrainsMono Nerd Font
    position = 0, 80
    halign = center
    valign = bottom
}

# ── BATTERY (top-right) ───────────────────────────────────────
label {
    monitor =
    text = cmd[update:30000] bash -c 'b=/sys/class/power_supply/BAT0; [ -d $b ] && echo "󰁹  $(cat $b/capacity)%" || echo ""'
    color = rgba(0, 255, 156, 0.85)
    font_size = 13
    font_family = JetBrainsMono Nerd Font
    position = -30, -30
    halign = right
    valign = top
}

# ── UPTIME (top-left) ─────────────────────────────────────────
label {
    monitor =
    text = cmd[update:60000] echo "󰔟  $(uptime -p | sed 's/up //')"
    color = rgba(0, 229, 255, 0.85)
    font_size = 13
    font_family = JetBrainsMono Nerd Font
    position = 30, -30
    halign = left
    valign = top
}
